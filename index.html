<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="form-container">
    <h2>IT Seminar Student Registration</h2>

    <form id="registrationForm" novalidate>
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" aria-describedby="fullNameError">
        <span id="fullNameError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Student Number -->
      <div class="form-group">
        <label for="studentNumber">Student Number</label>
        <input type="text" id="studentNumber" name="studentNumber" placeholder="24-1234-123" aria-describedby="studentNumberError">
        <span id="studentNumberError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" aria-describedby="emailError">
        <span id="emailError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label for="mobileNumber">Mobile Number</label>
        <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="09123456789 or +639123456789" aria-describedby="mobileNumberError">
        <span id="mobileNumberError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" aria-describedby="passwordError passwordFeedback">
        <span id="passwordFeedback" class="info-message" aria-live="polite"></span>
        <span id="passwordError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" aria-describedby="confirmPasswordError">
        <span id="confirmPasswordError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Course Dropdown -->
      <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course" aria-describedby="courseError">
          <option value="">Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <span id="courseError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Terms Agreement -->
      <div class="form-group checkbox-group">
        <label for="terms">
          <input type="checkbox" id="terms" name="terms" aria-describedby="termsError">
          I agree to the terms and conditions
        </label>
        <span id="termsError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Form Buttons -->
      <div class="button-group">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <!-- Success Message and Registration Summary -->
    <div id="successMessage" class="success-message" aria-live="polite"></div>

    <div id="registrationSummary" class="summary-container" hidden>
      <h3>Registration Summary</h3>
      <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
      <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
      <p><strong>Email Address:</strong> <span id="summaryEmail"></span></p>
      <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
      <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
